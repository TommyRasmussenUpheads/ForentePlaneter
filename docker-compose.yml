services:

  db:
    image: postgres:16-alpine
    container_name: forente_planeter_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forente_planeter
      POSTGRES_USER: forente_planeter
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      fp_net:
        ipv4_address: 172.25.0.3
      skydotten_db_net: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forente_planeter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forente_planeter_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      fp_net:
        ipv4_address: 172.25.0.4
      skydotten_db_net: {}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forente_planeter_api
    restart: unless-stopped
    ports:
      - "3200:3200"
    networks:
      fp_net:
        ipv4_address: 172.25.0.2
    environment:
      DATABASE_URL: postgresql+asyncpg://forente_planeter:${DB_PASSWORD}@db:5432/forente_planeter
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@forenteplaneter.no}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-mail.smtp2go.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@forenteplaneter.no}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Forente Planeter}
      GAME_BASE_URL: ${GAME_BASE_URL:-http://localhost:5173}
      INVITES_PER_PLAYER: ${INVITES_PER_PLAYER:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: bash -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 3200 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forente_planeter_worker
    restart: unless-stopped
    networks:
      fp_net:
        ipv4_address: 172.25.0.5
    environment:
      DATABASE_URL: postgresql+asyncpg://forente_planeter:${DB_PASSWORD}@db:5432/forente_planeter
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@forenteplaneter.no}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-mail.smtp2go.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@forenteplaneter.no}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Forente Planeter}
      GAME_BASE_URL: ${GAME_BASE_URL:-http://localhost:5173}
      INVITES_PER_PLAYER: ${INVITES_PER_PLAYER:-100}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info --pool=solo
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forente_planeter_beat
    restart: unless-stopped
    networks:
      fp_net:
        ipv4_address: 172.25.0.6
    environment:
      DATABASE_URL: postgresql+asyncpg://forente_planeter:${DB_PASSWORD}@db:5432/forente_planeter
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@forenteplaneter.no}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-mail.smtp2go.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@forenteplaneter.no}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Forente Planeter}
      GAME_BASE_URL: ${GAME_BASE_URL:-http://localhost:5173}
      INVITES_PER_PLAYER: ${INVITES_PER_PLAYER:-100}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forente_planeter_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      fp_net:
        ipv4_address: 172.25.0.7
    environment:
      VITE_API_URL: http://localhost:3200
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  fp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1
  skydotten_db_net:
    external: true

volumes:
  db_data:
  redis_data:
